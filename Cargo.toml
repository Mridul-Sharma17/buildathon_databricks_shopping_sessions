[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
memchr = "2.7"
parquet = { version = "=56.2.0", default-features = false, features = ["arrow", "snap"] }
rayon = "1.10"
rustc-hash = "2.1"
serde_json = "1.0"

[profile.release]
lto = "thin"
panic = "abort"
